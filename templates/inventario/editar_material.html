{% extends 'base.html' %}

{% block title %}
Editar Material
{% endblock %}

{% block content %}

<div class="flex justify-between items-center mb-6">

    <h1 class="text-3xl font-bold">
        Editar Material
    </h1>

</div>

<form method="POST" class="bg-white p-6 rounded-xl shadow">

    {% csrf_token %}

    <div class="grid grid-cols-2 gap-6">

        <!-- CODIGO -->
        <div>

            <label class="block mb-2 font-semibold">
                Código
            </label>

            <input
                type="text"
                name="codigo"
                value="{{ material.codigo }}"
                class="w-full border rounded-lg p-3"
                required
            >

        </div>

        <!-- NOMBRE -->
        <div>

            <label class="block mb-2 font-semibold">
                Nombre
            </label>

            <input
                type="text"
                name="nombre"
                value="{{ material.nombre }}"
                class="w-full border rounded-lg p-3"
                required
            >

        </div>

    </div>

    <!-- DESCRIPCION -->
    <div class="mt-6">

        <label class="block mb-2 font-semibold">
            Descripción
        </label>

        <textarea
            name="descripcion"
            class="w-full border rounded-lg p-3"
            rows="4"
        >{{ material.descripcion }}</textarea>

    </div>

    <div class="grid grid-cols-2 gap-6 mt-6">

        <!-- UNIDAD -->
        <div>

            <label class="block mb-2 font-semibold">
                Unidad Medida
            </label>

            <input
                type="text"
                name="unidad_medida"
                value="{{ material.unidad_medida }}"
                class="w-full border rounded-lg p-3"
                required
            >

        </div>

        <!-- STOCK MINIMO -->
        <div>

            <label class="block mb-2 font-semibold">
                Stock Mínimo
            </label>

            <input
                type="number"
                name="stock_minimo"
                value="{{ material.stock_minimo }}"
                class="w-full border rounded-lg p-3"
                required
            >

        </div>

    </div>

    <!-- BOTON -->
    <div class="mt-8 flex justify-end">

        <button
            type="submit"
            class="bg-yellow-500 text-white px-6 py-3 rounded-lg"
        >
            Actualizar Material
        </button>

    </div>

</form>

{% endblock %}
