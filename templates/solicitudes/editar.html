{% extends 'base.html' %}

{% block title %}
Editar Solicitud
{% endblock %}

{% block content %}

<div class="max-w-5xl mx-auto">

    <h1 class="text-2xl font-bold mb-6 text-gray-800 dark:text-gray-100">
        Editar Solicitud {{ solicitud.codigo }}
    </h1>

    <form id="form-editar" class="card p-6">
        {% csrf_token %}

        <!-- INPUT OCULTO PAYLOAD -->
        <div id="inputs_ocultos"></div>

        <table class="w-full border border-gray-100 dark:border-gray-800">

            <thead class="bg-gray-100 dark:bg-slate-900/50">
                <tr class="text-gray-700 dark:text-gray-300">
                    <th class="p-2 text-left">Material</th>
                    <th class="p-2 text-center">Cantidad</th>
                    <th class="p-2 text-center">Acción</th>
                </tr>
            </thead>

            <tbody id="tabla_materiales" class="divide-y divide-gray-100 dark:divide-gray-800"></tbody>

        </table>

        <div class="mt-6 flex justify-end gap-3">

            <a href="{% url 'solicitudes' %}" class="px-4 py-2 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-800 transition font-medium">
                Cancelar
            </a>

            <button type="button" onclick="guardarCambios()" class="btn-primary px-4 py-2 rounded-xl">
                Guardar Cambios
            </button>
        </div>

    </form>

</div>

<!-- ===================== JS (Se agregaron clases dinámicas en el template literal) ===================== -->
<script>

let carrito = {};

// cargar datos iniciales
const datos = JSON.parse('{{ detalles_json|escapejs }}');

datos.forEach(d => {
    carrito[d.id] = {
        nombre: d.nombre,
        cantidad: d.cantidad,
        stock: d.stock
    };
});

document.addEventListener('DOMContentLoaded', () => {
    renderTabla();
});

// ================= TABLA =================
function renderTabla() {
    const tbody = document.getElementById('tabla_materiales');
    tbody.innerHTML = '';

    Object.keys(carrito).forEach(id => {
        const item = carrito[id];

        tbody.innerHTML += `
            <tr class="border-t border-gray-100 dark:border-gray-800 hover:bg-gray-50/50 dark:hover:bg-slate-900/30 transition">
                <td class="p-2 text-sm text-gray-800 dark:text-gray-200">${item.nombre}</td>

                <td class="p-2 text-center">
                    <input type="number"
                        value="${item.cantidad}"
                        min="1"
                        max="${item.stock}"
                        onchange="editarCantidad('${id}', this)"
                        class="border border-gray-300 dark:border-gray-700 bg-white dark:bg-slate-900 text-gray-800 dark:text-gray-200 rounded-xl p-1.5 w-24 text-center focus:ring-1 focus:ring-red-500 focus:outline-none">
                </td>

                <td class="p-2 text-center">
                    <button type="button" onclick="eliminar('${id}')" class="text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 transition font-medium">
                        Eliminar
                    </button>
                </td>
            </tr>
        `;
    });
}

// ================= EDITAR =================
function editarCantidad(id, input) {
    let val = parseInt(input.value);

    if (val < 1) val = 1;

    const stock = carrito[id].stock;

    if (val > stock) {
        alert(`No puedes superar el stock (${stock})`);
        val = stock;
        input.value = stock;
    }

    carrito[id].cantidad = val;
}
// ================= ELIMINAR =================
function eliminar(id) {
    delete carrito[id];
    renderTabla();
}

// ================= GUARDAR (FETCH) =================
function guardarCambios() {

    const payload = {};

    Object.keys(carrito).forEach(id => {
        payload[id] = carrito[id].cantidad;
    });

    fetch(window.location.href, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRF()
        },
        body: JSON.stringify({
            payload: payload,
            justificacion: ""
        })
    })
    .then(r => r.json())
    .then(data => {

        if (data.ok) {
            alert("Guardado correctamente");
            window.location.href = "/solicitudes/";
        } else {
            alert(data.error || "Error");
        }

    })
    .catch(err => {
        console.error(err);
        alert("Error de red o backend");
    });
}

function getCSRF() {
    return document.querySelector('[name=csrfmiddlewaretoken]').value;
}

</script>
{% endblock %}
