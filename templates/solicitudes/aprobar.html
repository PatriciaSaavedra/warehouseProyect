{% extends 'base.html' %}

{% block content %}

<div class="max-w-5xl mx-auto">

    <h1 class="text-2xl font-bold mb-6 text-gray-800 dark:text-gray-100">
        Aprobar Solicitud {{ solicitud.codigo }}
    </h1>

    <form method="POST" class="card p-6">
        {% csrf_token %}

        <table class="w-full border border-gray-100 dark:border-gray-800">

            <thead class="bg-gray-100 dark:bg-slate-900/50">
                <tr class="text-gray-700 dark:text-gray-300">
                    <th class="p-2 text-left">Material</th>
                    <th class="p-2 text-center">Solicitado</th>
                    <th class="p-2 text-center">Aprobado</th>
                </tr>
            </thead>

            <tbody class="divide-y divide-gray-100 dark:divide-gray-800">

                {% for d in detalles %}
                <tr class="border-t border-gray-100 dark:border-gray-800 hover:bg-gray-50/50 dark:hover:bg-slate-900/30 transition">

                    <td class="p-2 text-sm text-gray-800 dark:text-gray-200">
                        {{ d.material.nombre }}
                    </td>

                    <td class="p-2 text-sm text-center text-gray-700 dark:text-gray-300">
                        {{ d.cantidad_solicitada }}
                    </td>

                    <td class="p-2 text-center">
                        <input
                            type="number"
                            name="aprobado_{{ d.id }}"
                            value="{{ d.cantidad_solicitada }}"
                            min="0"
                            max="{{ d.material.stock_actual }}"
                            class="border border-gray-300 dark:border-gray-700 bg-white dark:bg-slate-900 text-gray-855 dark:text-gray-200 p-2 rounded-xl w-24 text-center focus:ring-1 focus:ring-red-500 focus:outline-none"
                        >
                    </td>

                </tr>
                {% endfor %}

            </tbody>

        </table>

        <div class="mt-6 flex justify-end gap-3">

            <a href="{% url 'solicitudes' %}" class="px-4 py-2 border border-gray-300 dark:border-gray-700 text-gray-700 dark:text-gray-300 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-800 transition font-medium">
                Cancelar
            </a>

            <button class="px-4 py-2 bg-green-600 dark:bg-green-700 hover:bg-green-700 dark:hover:bg-green-800 text-white rounded-xl transition font-semibold">
                Guardar Aprobación
            </button>

        </div>

    </form>

</div>

{% endblock %}
