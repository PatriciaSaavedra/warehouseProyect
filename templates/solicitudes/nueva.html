{% extends 'base.html' %}

{% block title %}
Nueva Solicitud
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <!-- CABECERA -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800 dark:text-gray-100 font-['Outfit']">
                Nueva Solicitud
            </h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
                Completa el formulario para requerir materiales del almacén central
            </p>
        </div>
        
        <!-- Botón Volver -->
        <a
            href="{% url 'solicitudes' %}"
            class="flex items-center gap-2 border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-slate-900 text-gray-700 dark:text-gray-300 px-4 py-2.5 rounded-2xl text-sm font-semibold transition"
        >
            <span class="material-symbols-outlined text-[18px]">
                arrow_back
            </span>
            Volver
        </a>
    </div>

    <!-- FORMULARIO (Usando la clase .card) -->
    <form method="POST" class="card p-8 shadow-sm">
        {% csrf_token %}

        <!-- Grid principal de inputs superiores -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- FECHA DE SOLICITUD -->
            <div>
                <label class="block mb-2 text-sm font-bold text-gray-700 dark:text-gray-200 font-['Outfit']">
                    Fecha de Solicitud
                </label>
                <input
                    type="text"
                    value="{% now 'd/m/Y' %}"
                    class="w-full border border-gray-200 dark:border-gray-800 rounded-2xl p-3 bg-gray-50 dark:bg-slate-900/50 text-gray-400 dark:text-gray-500 cursor-not-allowed select-none font-medium focus:outline-none"
                    readonly
                >
                <input type="hidden" name="fecha" value="{% now 'Y-m-d' %}">
            </div>

            <!-- MATERIALES -->
            <div class="md:col-span-2">

                <label class="block mb-2 text-sm font-bold text-gray-700 dark:text-gray-200 font-['Outfit']">
                    Materiales Solicitados
                </label>

                <div class="grid grid-cols-12 gap-3 items-start">

                    <!-- Buscador y Selector -->
                    <div class="col-span-12 sm:col-span-6">
                        <select
                            id="material_select"
                            class="w-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-slate-900 text-gray-800 dark:text-gray-200 rounded-2xl p-3 focus:ring-2 focus:ring-[#8b0000] dark:focus:ring-red-500 focus:border-transparent transition"
                            onchange="document.getElementById('buscador_material').value = '';"
                        >
                            <option value="" class="dark:bg-[#151010]">Seleccionar material</option>

                            {% for material in materiales %}
                            <option 
                                value="{{ material.id }}" 
                                class="dark:bg-[#151010]"
                                data-stock="{{ material.stock_actual }}"
                            >
                                {{ material.nombre }}
                            </option>
                            {% endfor %}
                        </select>

                        <div class="mt-2 relative">
                            <input
                                type="text"
                                id="buscador_material"
                                placeholder="Buscar material..."
                                class="w-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-slate-900 text-gray-800 dark:text-gray-200 rounded-2xl p-3 focus:ring-2 focus:ring-[#8b0000] dark:focus:ring-red-500 focus:border-transparent transition"
                                onkeyup="buscarMateriales()"
                            >

                            <div id="resultados_busqueda" class="absolute bg-white dark:bg-[#151010] w-full border border-gray-100 dark:border-gray-800 rounded-xl mt-1 shadow-lg z-50 hidden"></div>
                        </div>                        
                    </div>

                    <!-- Input de Cantidad -->
                    <div class="col-span-8 sm:col-span-3">
                        <input
                            type="number"
                            id="cantidad_input"
                            min="1"
                            placeholder="Cantidad"
                            class="w-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-slate-900 text-gray-800 dark:text-gray-200 rounded-2xl p-3 focus:ring-2 focus:ring-[#8b0000] dark:focus:ring-red-500 focus:border-transparent transition"
                        >
                    </div>

                    <!-- NUEVO BOTÓN DE AGREGAR -->
                    <div class="col-span-4 sm:col-span-3">
                        <button
                            type="button"
                            onclick="agregarMaterial()"
                            class="w-full h-[50px] bg-gray-900 dark:bg-slate-800 hover:bg-gray-800 dark:hover:bg-slate-700 text-white rounded-2xl flex items-center justify-center gap-2 transition-all duration-200 hover:shadow-md active:scale-95 cursor-pointer"
                            title="Agregar a la lista"
                        >
                            <span class="material-symbols-outlined text-[20px]">
                                add_circle
                            </span>
                            <span class="text-sm font-bold font-['Outfit']">
                                Añadir
                            </span>
                        </button>
                    </div>

                </div>
                <div id="inputs_ocultos"></div>

            </div>
        </div>

        <!-- TABLA DE MATERIALES SELECCIONADOS -->
        <div class="mt-6 border border-gray-200 dark:border-gray-800 rounded-2xl overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-gray-850">
                    <tr>
                        <th class="p-4 font-bold text-gray-700 dark:text-gray-200">
                            Material
                        </th>
                        <th class="p-4 font-bold text-gray-700 dark:text-gray-200 text-center w-32">
                            Cantidad
                        </th>
                        <th class="p-4 font-bold text-gray-700 dark:text-gray-200 text-center w-24">
                            Acción
                        </th>
                    </tr>
                </thead>
                <tbody id="tabla_materiales" class="divide-y divide-gray-100 dark:divide-gray-800 bg-white dark:bg-transparent">
                    <!-- Se renderiza dinámicamente -->
                </tbody>
            </table>
        </div>

        <!-- JUSTIFICACION -->
        <div class="mt-6">
            <label class="block mb-2 text-sm font-bold text-gray-700 dark:text-gray-200 font-['Outfit']">
                Justificación <span class="text-[#8b0000]">*</span>
            </label>
            <textarea
                name="justificacion"
                class="w-full border border-gray-300 dark:border-gray-700 bg-white dark:bg-slate-900 text-gray-800 dark:text-gray-200 rounded-2xl p-3 focus:outline-none focus:ring-2 focus:ring-[#8b0000] dark:focus:ring-red-500 focus:border-transparent transition duration-150"
                rows="4"
                placeholder="Describa el motivo o justificación institucional de este requerimiento..."
                required
            ></textarea>
        </div>

        <!-- BOTONES DE ACCIÓN -->
        <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-800 flex flex-col-reverse sm:flex-row justify-end items-stretch sm:items-center gap-3">
            
            <a
                href="{% url 'solicitudes' %}"
                class="text-center border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-slate-800 text-gray-700 dark:text-gray-300 px-6 py-3 rounded-2xl font-semibold text-sm transition"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn-primary px-6 py-3 rounded-2xl font-semibold text-sm shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[18px]">
                    send
                </span>
                Enviar Solicitud
            </button>

        </div>

    </form>

</div>

<script>
let carrito = {};

// Iniciar la vista por defecto
document.addEventListener('DOMContentLoaded', () => {
    renderTabla();
    renderInputs();
});

function agregarMaterial() {
    const select = document.getElementById('material_select');
    const cantidadInput = document.getElementById('cantidad_input');

    const materialId = select.value;
    const selectedOption = select.options[select.selectedIndex];
    const cantidad = parseInt(cantidadInput.value);

    if (!materialId || !selectedOption || isNaN(cantidad) || cantidad <= 0) {
        alert("Seleccione un material y defina una cantidad válida mayor a 0.");
        return;
    }

    const materialNombre = selectedOption.text;
    const stockActual = parseInt(selectedOption.getAttribute('data-stock')) || 0;

    if (cantidad > stockActual) {
        alert(`No hay stock suficiente. Stock disponible: ${stockActual}`);
        return;
    }

    if (carrito[materialId]) {
        const nuevaCantidad = carrito[materialId].cantidad + cantidad;
        if (nuevaCantidad > stockActual) {
            alert(`La cantidad total (${nuevaCantidad}) supera el stock disponible (${stockActual})`);
            return;
        }
        carrito[materialId].cantidad = nuevaCantidad;
    } else {
        carrito[materialId] = {
            nombre: materialNombre,
            cantidad: cantidad,
            stock: stockActual
        };
    }

    renderTabla();
    renderInputs();

    select.value = '';
    document.getElementById('buscador_material').value = '';
    cantidadInput.value = '';
}

function renderTabla() {
    const tabla = document.getElementById('tabla_materiales');
    tabla.innerHTML = '';

    const keys = Object.keys(carrito);
    if (keys.length === 0) {
        tabla.innerHTML = `
            <tr>
                <td colspan="3" class="p-8 text-center text-gray-400 dark:text-gray-500 bg-transparent">
                    No se han añadido materiales a la solicitud todavía.
                </td>
            </tr>
        `;
        return;
    }

    keys.forEach(id => {
        const item = carrito[id];

        tabla.innerHTML += `
            <tr class="hover:bg-gray-50/50 dark:hover:bg-slate-900/30 transition">
                <td class="p-4 text-gray-800 dark:text-gray-200 font-medium">${item.nombre}</td>
                <td class="p-4 text-center">
                    <input 
                        type="number"
                        value="${item.cantidad}"
                        min="1"
                        max="${item.stock}"
                        onchange="editarCantidad(${id}, this)"
                        class="border border-gray-300 dark:border-gray-700 bg-white dark:bg-slate-900 text-gray-800 dark:text-gray-200 rounded-xl p-1.5 w-20 text-center focus:ring-1 focus:ring-red-500 focus:outline-none"
                    >
                </td>
                <td class="p-4 text-center">
                    <button type="button" onclick="eliminar(${id})" class="text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 font-medium transition">
                        Eliminar
                    </button>
                </td>
            </tr>
        `;
    });
}

function editarCantidad(id, inputElement) {
    let nuevaCantidad = parseInt(inputElement.value) || 1;
    if (nuevaCantidad < 1) nuevaCantidad = 1;

    const item = carrito[id];
    if (item) {
        if (nuevaCantidad > item.stock) {
            alert(`No puedes solicitar más de lo disponible (${item.stock}). Se ajustará al máximo.`);
            nuevaCantidad = item.stock;
        }
        item.cantidad = nuevaCantidad;
        inputElement.value = nuevaCantidad;
    }
    renderInputs();
}

function eliminar(id) {
    delete carrito[id];
    renderTabla();
    renderInputs();
}

function renderInputs() {
    const contenedor = document.getElementById('inputs_ocultos');

    const payload = {};

    Object.keys(carrito).forEach(id => {
        payload[id] = carrito[id].cantidad;
    });

    contenedor.innerHTML = `
        <input type="hidden" name="payload" value='${JSON.stringify(payload)}'>
    `;
}
</script>

<script>
function buscarMateriales() {
    const query = document.getElementById('buscador_material').value;
    const resultados = document.getElementById('resultados_busqueda');

    if (query.length < 2) {
        resultados.innerHTML = '';
        resultados.classList.add('hidden');
        return;
    }

    fetch(`/solicitudes/buscar-materiales/?q=${query}`)
        .then(response => response.json())
        .then(data => {
            resultados.innerHTML = '';

            if (data.length === 0) {
                resultados.innerHTML = '<div class="p-3 text-gray-500 dark:text-gray-400 text-sm text-center">Sin resultados</div>';
            } else {
                data.forEach(material => {
                    resultados.innerHTML += `
                        <div 
                            class="p-3 hover:bg-gray-100 dark:hover:bg-slate-800 cursor-pointer text-sm border-b border-gray-100 dark:border-gray-800 last:border-none transition duration-100"
                            onclick="seleccionarMaterial(${material.id}, '${material.nombre}', ${material.stock_actual})"
                        >
                            <span class="font-medium text-gray-800 dark:text-gray-200">${material.nombre}</span>
                            <span class="text-xs text-gray-400 dark:text-gray-500 block mt-0.5">(Stock actual: ${material.stock_actual})</span>
                        </div>
                    `;
                });
            }

            resultados.classList.remove('hidden');
        });
}

function seleccionarMaterial(id, nombre, stock) {
    const select = document.getElementById('material_select');

    let option = select.querySelector(`option[value="${id}"]`);
    if (!option) {
        option = document.createElement('option');
        option.value = id;
        option.textContent = nombre;
        option.setAttribute('data-stock', stock);
        select.appendChild(option);
    }

    select.value = id;
    document.getElementById('cantidad_input').focus();
    document.getElementById('buscador_material').value = nombre;
    document.getElementById('resultados_busqueda').classList.add('hidden');

    window.stockSeleccionado = stock;
}

document.addEventListener('click', function(e) {
    const buscador = document.getElementById('buscador_material');
    const resultados = document.getElementById('resultados_busqueda');
    if (buscador && resultados && !buscador.contains(e.target) && !resultados.contains(e.target)) {
        resultados.classList.add('hidden');
    }
});
</script>
{% endblock %}
