{% extends 'base.html' %}

{% block title %}
Nueva Solicitud
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <!-- CABECERA -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800 font-['Outfit']">
                Nueva Solicitud
            </h1>
            <p class="text-sm text-gray-500 mt-1">
                Completa el formulario para requerir materiales del almacén central
            </p>
        </div>
        
        <!-- Botón Volver -->
        <a
            href="{% url 'solicitudes' %}"
            class="flex items-center gap-2 border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-2xl text-sm font-semibold transition"
        >
            <span class="material-symbols-outlined text-[18px]">
                arrow_back
            </span>
            Volver
        </a>
    </div>

    <!-- FORMULARIO (Usando la clase .card) -->
    <form method="POST" class="card p-8 shadow-sm">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- FECHA DE SOLICITUD (Solo lectura y automatizada al día de hoy) -->
            <div>
                <label class="block mb-2 text-sm font-bold text-gray-700 font-['Outfit']">
                    Fecha de Solicitud
                </label>
                <!-- Visual para el usuario -->
                <input
                    type="text"
                    value="{% now 'd/m/Y' %}"
                    class="w-full border border-gray-200 rounded-2xl p-3 bg-gray-50 text-gray-400 cursor-not-allowed select-none font-medium focus:outline-none"
                    readonly
                >
                <!-- Campo oculto para enviar al backend en formato AAAA-MM-DD -->
                <input type="hidden" name="fecha" value="{% now 'Y-m-d' %}">
            </div>

            <!-- MATERIAL -->
            <div>
                <label class="block mb-2 text-sm font-bold text-gray-700 font-['Outfit']">
                    Material Requerido <span class="text-[#8b0000]">*</span>
                </label>
                <div class="relative">
                    <select
                        name="material"
                        class="w-full border border-gray-300 rounded-2xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#8b0000] focus:border-transparent transition duration-150 appearance-none bg-white pr-10"
                        required
                    >
                        <option value="">Seleccionar material</option>
                        {% for material in materiales %}
                            <option value="{{ material.id }}">
                                {{ material.nombre }}
                            </option>
                        {% endfor %}
                    </select>

                </div>
            </div>

        </div>

        <!-- CANTIDAD -->
        <div class="mt-6">
            <label class="block mb-2 text-sm font-bold text-gray-700 font-['Outfit']">
                Cantidad Solicitada <span class="text-[#8b0000]">*</span>
            </label>
            <input
                type="number"
                name="cantidad"
                min="1"
                class="w-full border border-gray-300 rounded-2xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#8b0000] focus:border-transparent transition duration-150"
                placeholder="Ingrese cantidad"
                required
            >
        </div>

        <!-- JUSTIFICACION -->
        <div class="mt-6">
            <label class="block mb-2 text-sm font-bold text-gray-700 font-['Outfit']">
                Justificación <span class="text-[#8b0000]">*</span>
            </label>
            <textarea
                name="justificacion"
                class="w-full border border-gray-300 rounded-2xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#8b0000] focus:border-transparent transition duration-150"
                rows="4"
                placeholder="Describa el motivo o justificación institucional de este requerimiento..."
                required
            ></textarea>
        </div>

        <!-- BOTONES DE ACCIÓN (Alineados a la derecha) -->
        <div class="mt-8 pt-6 border-t border-gray-100 flex flex-col-reverse sm:flex-row justify-end items-stretch sm:items-center gap-3">
            
            <a
                href="{% url 'solicitudes' %}"
                class="text-center border border-gray-300 hover:bg-gray-50 text-gray-700 px-6 py-3 rounded-2xl font-semibold text-sm transition"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="btn-primary px-6 py-3 rounded-2xl font-semibold text-sm shadow-md hover:shadow-lg transition flex items-center justify-center gap-2 cursor-pointer"
            >
                <span class="material-symbols-outlined text-[18px]">
                    send
                </span>
                Enviar Solicitud
            </button>

        </div>

    </form>

</div>

{% endblock %}
