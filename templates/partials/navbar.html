<header class="fixed top-0 right-0 w-[calc(100%-260px)] h-16 bg-white border-b flex items-center justify-between px-6 z-30">

    <h2 class="text-xl font-bold text-red-900">
        SGA - Sistema de Gestión de Almacén
    </h2>

    <div class="flex items-center gap-4">

        <input
            type="text"
            placeholder="Buscar..."
            class="border rounded-lg px-4 py-2 w-72"
        >

        <button>
            <span class="material-symbols-outlined">
                notifications
            </span>
        </button>

        <div class="flex items-center gap-3">

            <div class="text-right">

                <p class="font-semibold">
                    {{ request.user.first_name }}
                    {{ request.user.last_name }}
                </p>

                <p class="text-sm text-gray-500">

                    {% if request.user.perfilusuario %}

                        {{ request.user.perfilusuario.get_rol_display }}

                    {% endif %}

                </p>

            </div>

            <div class="w-10 h-10 rounded-full bg-red-900 text-white flex items-center justify-center">

                {{ request.user.username|first|upper }}

            </div>

        </div>

    </div>

</header>
