{% extends 'base.html' %}

{% block title %} Registrar Secretaría {% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800 dark:text-gray-100 font-['Outfit']">Registrar Secretaría</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Añada una nueva Secretaría Departamental de nivel jerárquico superior.</p>
        </div>
        <a href="{% url 'secretarias_list' %}" class="flex items-center gap-2 border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2.5 rounded-2xl text-sm font-semibold transition">
            <span class="material-symbols-outlined text-[18px]">arrow_back</span> Volver
        </a>
    </div>

    <form method="POST" class="card p-8 shadow-sm space-y-6 bg-white">
        {% csrf_token %}
        <div class="space-y-6">
            <div>
                <label class="block mb-2 text-sm font-bold text-gray-700 font-['Outfit']">Nombre Oficial de la Secretaría <span class="text-[#8b0000]">*</span></label>
                <input type="text" name="nombre" class="w-full border border-gray-300 rounded-2xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#8b0000] focus:border-transparent transition" placeholder="Ej. Secretaría Departamental de Desarrollo Humano" required>
            </div>
            <div>
                <label class="block mb-2 text-sm font-bold text-gray-700 font-['Outfit']">Sigla o Código Identificador</label>
                <input type="text" name="codigo" class="w-full border border-gray-300 rounded-2xl p-3 text-gray-800 focus:outline-none focus:ring-2 focus:ring-[#8b0000] focus:border-transparent transition" placeholder="Ej. SDDH">
            </div>
        </div>
        <div class="pt-6 border-t border-gray-100 flex flex-col-reverse sm:flex-row justify-end items-stretch sm:items-center gap-3">
            <a href="{% url 'secretarias_list' %}" class="text-center border border-gray-300 hover:bg-gray-50 text-gray-700 px-6 py-3 rounded-2xl font-semibold text-sm transition">Cancelar</a>
            <button type="submit" class="btn-primary px-6 py-3 rounded-2xl font-semibold text-sm shadow-md hover:shadow transition flex items-center justify-center gap-2 cursor-pointer"><span class="material-symbols-outlined text-[18px]">save</span> Guardar Secretaría</button>
        </div>
    </form>
</div>
{% endblock %}
