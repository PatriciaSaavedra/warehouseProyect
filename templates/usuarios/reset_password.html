{% extends 'base.html' %}

{% block title %}
Restablecer Contraseña
{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <!-- HEADER -->
    <div class="mb-8">

        <h1 class="text-3xl font-bold text-gray-800">
            Restablecer Contraseña
        </h1>

        <p class="text-gray-500 mt-2">
            Cambio de contraseña del usuario
        </p>

    </div>

    <!-- CARD -->
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8">

        <div class="mb-8">

            <p class="text-gray-600">
                Usuario:
            </p>

            <p class="text-xl font-semibold text-gray-800 mt-1">

                {{ usuario_obj.first_name }}
                {{ usuario_obj.last_name }}

            </p>

            <p class="text-gray-500">
                @{{ usuario_obj.username }}
            </p>

        </div>

        <form method="POST" class="space-y-6">

            {% csrf_token %}

            <!-- PASSWORD -->
            <div>

                <label class="block mb-2 text-sm font-semibold text-gray-700">
                    Nueva Contraseña
                </label>

                <div class="relative">

                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="w-full rounded-2xl border border-gray-300 px-4 py-3
                        focus:outline-none focus:ring-2 focus:ring-red-800 transition"
                        placeholder="Ingrese nueva contraseña"
                        required
                    >

                    <button
                        type="button"
                        onclick="togglePassword()"
                        class="absolute right-4 top-3 text-gray-500 hover:text-red-900 transition"
                    >

                        <span
                            id="eyeIcon"
                            class="material-symbols-outlined"
                        >
                            visibility
                        </span>

                    </button>

                </div>

            </div>

            <!-- BUTTONS -->
            <div class="flex justify-end gap-4 pt-4">

                <a
                    href="{% url 'usuarios' %}"
                    class="px-6 py-3 rounded-2xl border border-gray-300
                    hover:bg-gray-100 transition"
                >
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="bg-red-900 hover:bg-red-800 text-white px-6 py-3
                    rounded-2xl shadow-lg hover:shadow-2xl
                    active:scale-[0.98] transition-all duration-200"
                >
                    Actualizar Contraseña
                </button>

            </div>

        </form>

    </div>

</div>

<!-- SCRIPT -->
<script>

function togglePassword() {

    const password = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (password.type === 'password') {

        password.type = 'text';
        eyeIcon.innerText = 'visibility_off';

    } else {

        password.type = 'password';
        eyeIcon.innerText = 'visibility';

    }

}

</script>

{% endblock %}
